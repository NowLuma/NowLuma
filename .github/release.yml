# Categories for GitHub's auto-generated release notes. The tag workflow
# publishes the CHANGELOG.md section instead; keep these labels in sync.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能 / Features
      labels:
        - feat
        - enhancement
        - feature
    - title: 修复 / Fixes
      labels:
        - fix
        - bug
    - title: 文档 / Documentation
      labels:
        - docs
    - title: 部署与发行 / Deploy and release
      labels:
        - deploy
        - ci
        - build
    - title: 其他变更 / Other changes
      labels:
        - '*'
