name: Nowluma CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nowluma-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: node tools/check-identity.mjs
      - run: pnpm test
      - run: node tools/check-action-catalog.mjs
      - run: node --test deploy/docker/healthcheck.test.cjs
      - run: bash -n deploy/install.sh && bash -n deploy/manage.sh && bash -n deploy/docker/entrypoint.sh
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: pnpm run build:all
      - run: node tools/check-release-layout.mjs dist
      - uses: actions/upload-artifact@v6
        with:
          name: nowluma-linux-x64-lite
          path: dist/
          if-no-files-found: error
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: nowluma:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify startup, native hook, desktop and restart/recreation persistence
        run: node deploy/docker/smoke.mjs nowluma:ci
