name: Nowluma PR
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
concurrency:
  group: nowluma-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Check out the base commit only. The title and body arrive as data, so a
      # pull request can never edit the script that gates it, and the read-only
      # token means forks need no secret at all.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Check the Conventional Commit title and the pull request template
        run: node .github/scripts/pr-check.cjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
