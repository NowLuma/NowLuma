name: nowluma
services:
  nowluma:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        QQ_DEB_URL: ${QQ_DEB_URL:-}
        QQ_DEB_SHA256: ${QQ_DEB_SHA256:-}
    image: nowluma:local
    hostname: nowluma
    restart: unless-stopped
    # Publish locally by default; the installer can explicitly opt into LAN access.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-5099}:5099"
      - "${BIND_ADDRESS:-127.0.0.1}:${VNC_PORT:-6080}:6080"
      - "${BIND_ADDRESS:-127.0.0.1}:${ONEBOT_HTTP_PORT:-3000}:3000"
      - "${BIND_ADDRESS:-127.0.0.1}:${ONEBOT_WS_PORT:-3001}:3001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NOWLUMA_WEBUI_HOST: 0.0.0.0
      NOWLUMA_WEBUI_PORT: 5099
      NOWLUMA_VNC_PORT: ${VNC_PORT:-6080}
      NOWLUMA_VNC_URL: ${VNC_URL:-}
      NOWLUMA_HOOK_AUTOLOAD: "1"
      NOWLUMA_ONEBOT_HOST: 0.0.0.0
      SCREEN_GEOMETRY: ${SCREEN_GEOMETRY:-1280x800x24}
    volumes:
      - config:/app/config
      - data:/app/data
      - logs:/app/logs
      # Persist all QQ user settings and credential stores, not just login.db.
      - qq-home:/home/nowluma
    cap_add:
      - SYS_PTRACE
    shm_size: "1gb"
    stop_grace_period: 35s

volumes:
  config:
  data:
  logs:
  qq-home:
